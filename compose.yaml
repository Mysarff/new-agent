services:
  wayloom:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # This image runs the UI with local specialists and real MCP subprocesses.
      # Independent A2A services use the separate wayloom.stack launcher.
      WAYLOOM_A2A: "0"
      WAYLOOM_CONFIG: config/travel.json
    volumes:
      - ./travel_knowledge:/app/travel_knowledge:ro
      - smartvoyage-data:/app/var
    init: true
    restart: unless-stopped
volumes:
  smartvoyage-data:
