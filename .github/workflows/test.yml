name: OpsAtlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m opsatlas.cli ingest
      - run: python -m opsatlas.verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsatlas-verification
          path: reports/verification.json
