name: Wayloom checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      WAYLOOM_CONFIG: config/travel.json
      WAYLOOM_A2A: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile travel application
        run: python -m compileall -q wayloom app.py
      - name: Run travel tests without external API credentials
        run: python -m unittest discover -s tests -p 'test_travel_*.py' -v
      - name: Build local knowledge index without embeddings
        run: python -m wayloom.main ingest
      - name: Evaluate curated retrieval set without external credentials
        run: python -m wayloom.benchmark --rag --output reports/rag_eval.json
      - name: Discover local MCP tools without executing external APIs
        run: |
          mkdir -p reports
          python -m wayloom.main discover > reports/mcp_discovery.json
          python -c "import json; p=json.load(open('reports/mcp_discovery.json')); assert any(x.get('tools') for x in p), 'No MCP tools discovered'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayloom-offline-checks
          path: |
            reports/mcp_discovery.json
            reports/rag_eval.json
            var/travel_index.json
          if-no-files-found: warn
